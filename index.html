<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Retro Tamagotchi Clone</title>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: #d9dde1;
				overflow: hidden;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100dvh;
				padding: 0;
				box-sizing: border-box;
			}

			#tamagotchi-console {
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;
				width: min(100vw, 72dvh, 560px);
				height: min(100dvh, 138.889vw, 778px);
				padding: 10px 10px 14px;
				box-sizing: border-box;
				border: 1px solid #bdc4ca;
				border-radius: 34px;
				background: linear-gradient(180deg,#fbfbfb 0%,#f3f4f5 72%,#e7eaed 100%);
				box-shadow: 0 10px 30px rgba(24,34,44,.22), inset 0 1px 0 #fff;
				overflow: hidden;
			}

			#tamagotchi-console::before {
				content: "DIGITAL PET";
				position: absolute;
				z-index: 65;
				top: 15px;
				left: 50%;
				transform: translateX(-50%);
				font: 800 9px/1 system-ui,sans-serif;
				letter-spacing: .18em;
				color: rgba(62,70,76,.62);
				pointer-events: none;
			}

			#screen-bezel {
				width: 100%;
				aspect-ratio: 1 / 1;
				padding: 5px;
				margin-top: 26px;
				box-sizing: border-box;
				border: 1px solid #aab2b8;
				border-radius: 24px;
				background: #dce2e2;
				box-shadow: inset 0 1px 2px rgba(0,0,0,.18), 0 1px 0 #fff;
				flex: 0 0 auto;
			}

			#tamagotchi-screen {
				position: relative;
				width: 100%;
				height: 100%;
				border: 1px solid #67746f;
				border-radius: 19px;
				background: #aebeb6;
				box-sizing: border-box;
				overflow: hidden;
			}

			#partner-select {
				position: absolute;
				z-index: 50;
				inset: 0;
				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-template-rows: auto 1fr 1fr auto;
				gap: 6px;
				padding: 12px;
				box-sizing: border-box;
				background: #afbeb5;
				color: #17221d;
				font-family: monospace;
			}

			#partner-select.hidden { display: none; }
			#partner-select .select-title {
				grid-column: 1 / -1;
				font-weight: 900;
				font-size: clamp(10px, 1.6dvh, 14px);
				text-align: center;
				letter-spacing: .08em;
			}
			.partner-card {
				position: relative;
				min-width: 0;
				border: 1px solid #607067;
				border-radius: 12px;
				background: rgba(226,234,223,.66);
				color: #182012;
				font: 900 clamp(8px, 1.25dvh, 11px) monospace;
				text-transform: uppercase;
				box-shadow: inset 0 -2px rgba(0,0,0,.08);
				cursor: pointer;
			}
			.partner-card.selected { background: #e8efe4; outline: 2px solid #33423b; }
			.partner-card::before {
				content: "";
				display: block;
				width: 26px;
				height: 26px;
				margin: 4px auto 3px;
				border-radius: 5px;
				background: var(--partner-color);
				box-shadow: inset -6px -6px var(--partner-dark), 0 0 0 2px #222;
				image-rendering: pixelated;
			}
			#partner-select .select-help {
				grid-column: 1 / -1;
				font-size: clamp(7px, 1.05dvh, 9px);
				text-align: center;
			}

			#partner-change {
				position: absolute;
				z-index: 60;
				top: 8px;
				right: 13px;
				border: 1px solid #c2c8cc;
				border-radius: 999px;
				background: rgba(255,255,255,.7);
				color: #505a61;
				font: 800 8px system-ui,sans-serif;
				padding: 5px 8px;
				cursor: pointer;
			}

			#name-change {
				position: absolute;
				z-index: 60;
				top: 8px;
				left: 13px;
				border: 1px solid #c2c8cc;
				border-radius: 999px;
				background: rgba(255,255,255,.7);
				color: #505a61;
				font: 800 8px system-ui,sans-serif;
				padding: 5px 8px;
				cursor: pointer;
			}

			#name-editor {
				position: absolute;
				z-index: 70;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 10px;
				padding: 18px;
				box-sizing: border-box;
				background: #afbeb5;
				color: #182012;
				font: 900 14px monospace;
			}

			#name-editor.hidden { display: none; }
			#name-editor input {
				width: 82%;
				border: 3px solid #202719;
				background: #edf1bf;
				color: #182012;
				font: 900 18px monospace;
				text-align: center;
				text-transform: uppercase;
				padding: 8px;
				outline: 0;
			}

			#name-editor .name-actions {
				display: flex;
				gap: 8px;
			}

			#name-editor button {
				border: 3px solid #202719;
				background: #c9d3a9;
				color: #182012;
				font: 900 11px monospace;
				padding: 7px 12px;
			}

			#tamagotchi-screen canvas {
				display: block;
				width: 100% !important;
				height: 100% !important;
				image-rendering: pixelated;
				touch-action: manipulation;
			}

			#mobile-controls {
				display: flex;
				position: relative;
				flex-direction: column;
				width: 78%;
				margin-top: 26px;
				margin-bottom: 0;
				z-index: 9999;
				justify-content: center;
				align-items: center;
				gap: 12px;
			}

			#mobile-controls .button-row {
				display: flex;
				width: 100%;
				justify-content: space-around;
				align-items: center;
				gap: 8%;
			}

			#mobile-controls button {
				width: clamp(46px, 7.4dvh, 62px);
				height: clamp(46px, 7.4dvh, 62px);
				border: 0;
				border-radius: 50%;
				background: #f3a423;
				box-shadow: inset 0 -3px 0 rgba(135,73,0,.24), 0 2px 5px rgba(0,0,0,.22);
				color: #5a3000;
				font: 800 clamp(17px, 2.5dvh, 22px) system-ui,sans-serif;
				pointer-events: auto;
				touch-action: none;
				-webkit-user-select: none;
				user-select: none;
			}

			#mobile-controls button:active,
			#mobile-controls button.pressed {
				transform: translateY(3px);
				box-shadow: inset 0 -1px 0 rgba(0,0,0,0.16), 0 1px 2px rgba(0,0,0,.18);
			}

			#mobile-controls .hint {
				position: static;
				width: 100%;
				text-align: center;
				font: 700 clamp(7px, 1.05dvh, 9px) system-ui,sans-serif;
				color: #6e777d;
				text-shadow: none;
			}

			#speed-change {
				position: absolute;
				z-index: 66;
				top: 8px;
				left: 50%;
				transform: translateX(-50%);
				border: 1px solid #c2c8cc;
				border-radius: 999px;
				background: rgba(255,255,255,.78);
				color: #505a61;
				font: 800 8px system-ui,sans-serif;
				padding: 5px 9px;
				cursor: pointer;
			}

			#mobile-controls button:nth-of-type(1) { background: #2777d8; color: #fff; }
			#mobile-controls button:nth-of-type(2) { background: #f2b22e; color: #6b4300; }
			#mobile-controls button:nth-of-type(3) { background: #e44738; color: #fff; }

			@media (max-width: 520px) {
				#tamagotchi-console {
					width: 100vw;
					height: 100dvh;
					border-radius: 0;
					border: 0;
					box-shadow: none;
					padding: 8px 8px 12px;
				}
				#screen-bezel { margin-top: 24px; }
			}
		</style>
		<script src="js/phaser.js?v=20260826-2"></script>
		<script src="js/domain/p1-character-profiles.js?v=20260826-2"></script>
		<script src="js/domain/digimon-partners.js?v=20260826-7"></script>
		<script src="js/domain/p1-device-engine.js?v=20260826-6"></script>
		<script src="js/ui/device-shell.js?v=20260826-6"></script>
		<script src="js/care/feeding-screen.js?v=20260826-2"></script>
		<script src="js/care/left-right-game.js?v=20260826-2"></script>
		<script src="js/shop.js?v=20260826-2"></script>
		<script src="js/system/save-storage.js?v=20260826-6"></script>
		<script src="js/settings.js?v=20260826-2"></script>
		<script src="js/game.js?v=20260826-6"></script>
  </head>
  <body>
	<div id="tamagotchi-console">
		<button id="name-change" type="button">NAME</button>
		<button id="speed-change" type="button">SPEED 1x</button>
		<button id="partner-change" type="button">PARTNER</button>
		<div id="screen-bezel"><div id="tamagotchi-screen">
			<div id="partner-select" class="hidden" aria-label="Choose Digimon partner">
				<div class="select-title">CHOOSE PARTNER</div>
				<button class="partner-card" type="button" data-partner="agumon" style="--partner-color:#e98a2f;--partner-dark:#743411">AGUMON</button>
				<button class="partner-card" type="button" data-partner="gabumon" style="--partner-color:#d8c08c;--partner-dark:#44578e">GABUMON</button>
				<button class="partner-card" type="button" data-partner="patamon" style="--partner-color:#d99b57;--partner-dark:#7c4a27">PATAMON</button>
				<button class="partner-card" type="button" data-partner="tentomon" style="--partner-color:#b83b35;--partner-dark:#28304e">TENTOMON</button>
				<div class="select-help">A PREV · B OK · C NEXT</div>
			</div>
			<div id="name-editor" class="hidden" aria-label="Set partner name">
				<div>SET NAME</div>
				<input id="partner-name-input" maxlength="10" autocomplete="off" />
				<div class="name-actions">
					<button id="name-save" type="button">SAVE</button>
					<button id="name-cancel" type="button">CANCEL</button>
				</div>
			</div>
		</div></div>
		<div id="mobile-controls" aria-label="Tamagotchi controls">
			<div class="hint">A SELECT / LEFT · B OK / RIGHT · C BACK</div>
			<div class="button-row">
				<button type="button" data-key="65" aria-label="A button">A</button>
				<button type="button" data-key="66" aria-label="B button">B</button>
				<button type="button" data-key="67" aria-label="C button">C</button>
			</div>
		</div>
	</div>
	<script>
		(function () {
			var selector = document.getElementById('partner-select');
			var nameEditor = document.getElementById('name-editor');
			var nameInput = document.getElementById('partner-name-input');
			var cards = Array.prototype.slice.call(document.querySelectorAll('.partner-card'));
			var speedButton = document.getElementById('speed-change');
			var selectedIndex = 0;
			function currentStoredPartner(){ try { return localStorage.getItem('retro-digimon-partner'); } catch (_) { return null; } }
			function syncSelection(id){
				var found = cards.findIndex(function(card){ return card.getAttribute('data-partner') === id; });
				selectedIndex = found >= 0 ? found : 0;
				cards.forEach(function(card,index){ card.classList.toggle('selected', index === selectedIndex); });
			}
			function showSelector(){ syncSelection(currentStoredPartner() || 'agumon'); selector.classList.remove('hidden'); }
			function choosePartner(id){
				try { localStorage.setItem('retro-digimon-partner', id); } catch (_) {}
				if(window.pet && window.DigimonPartners){
					var oldDefault = !window.pet.name || window.pet.name === 'BBQ MAN' || window.pet.name === window.pet.partnerName;
					DigimonPartners.applyToPet(window.pet,id);
					if(oldDefault) window.pet.name = window.pet.partnerName;
					if(typeof saveStorage === 'function') saveStorage();
				}
				selector.classList.add('hidden');
				window.dispatchEvent(new CustomEvent('digimon-partner-change',{detail:{id:id}}));
				if(!window.pet || !window.pet.name) showNameEditor();
			}
			cards.forEach(function(card,index){ card.addEventListener('click', function(){ selectedIndex=index; syncSelection(card.getAttribute('data-partner')); choosePartner(card.getAttribute('data-partner')); }); });
			document.getElementById('partner-change').addEventListener('click', showSelector);
			function showNameEditor(){
				var fallback = window.pet && window.pet.partnerName ? window.pet.partnerName : 'PARTNER';
				nameInput.value = (window.pet && window.pet.name && window.pet.name !== 'BBQ MAN') ? window.pet.name : fallback;
				nameEditor.classList.remove('hidden');
				setTimeout(function(){ nameInput.focus(); nameInput.select(); },0);
			}
			function saveName(){
				var fallback = window.pet && window.pet.partnerName ? window.pet.partnerName : 'PARTNER';
				var value = nameInput.value.trim().replace(/\s+/g,' ').slice(0,10).toUpperCase() || fallback;
				if(window.pet){ window.pet.name = value; if(typeof saveStorage === 'function') saveStorage(); }
				nameEditor.classList.add('hidden');
			}
			document.getElementById('name-change').addEventListener('click', showNameEditor);
			document.getElementById('name-save').addEventListener('click', saveName);
			document.getElementById('name-cancel').addEventListener('click', function(){ nameEditor.classList.add('hidden'); });
			function currentSpeed(){
				var speed = window.globalVal ? Number(window.globalVal.speedMultiplier) : 1;
				return speed === 2 || speed === 4 ? speed : 1;
			}
			function renderSpeed(){ speedButton.textContent = 'SPEED ' + currentSpeed() + 'x'; }
			speedButton.addEventListener('click', function(){
				var speed = currentSpeed();
				var next = speed === 1 ? 2 : (speed === 2 ? 4 : 1);
				if(window.globalVal){ window.globalVal.speedMultiplier = next; if(typeof saveStorage === 'function') saveStorage(); }
				renderSpeed();
			});
			setTimeout(renderSpeed,0);
			nameInput.addEventListener('keydown', function(event){
				if(event.key === 'Enter'){ event.preventDefault(); saveName(); }
				if(event.key === 'Escape'){ event.preventDefault(); nameEditor.classList.add('hidden'); }
			});
			if(!currentStoredPartner()) showSelector(); else syncSelection(currentStoredPartner());
			window.addEventListener('keydown', function(event){
				if(selector.classList.contains('hidden')) return;
				if(event.keyCode === 65){ selectedIndex=(selectedIndex-1+cards.length)%cards.length; syncSelection(cards[selectedIndex].getAttribute('data-partner')); event.stopImmediatePropagation(); }
				if(event.keyCode === 67){ selectedIndex=(selectedIndex+1)%cards.length; syncSelection(cards[selectedIndex].getAttribute('data-partner')); event.stopImmediatePropagation(); }
				if(event.keyCode === 66){ choosePartner(cards[selectedIndex].getAttribute('data-partner')); event.stopImmediatePropagation(); }
			}, true);

			function sendKey(type, keyCode) {
				var event = new KeyboardEvent(type, { bubbles: true, cancelable: true });
				try { Object.defineProperty(event, 'keyCode', { get: function(){ return keyCode; } }); } catch (_) {}
				try { Object.defineProperty(event, 'which', { get: function(){ return keyCode; } }); } catch (_) {}
				window.dispatchEvent(event);
			}

			document.querySelectorAll('#mobile-controls button').forEach(function (button) {
				var keyCode = Number(button.getAttribute('data-key'));
				button.addEventListener('pointerdown', function (event) {
					event.preventDefault();
					button.setPointerCapture(event.pointerId);
					button.classList.add('pressed');
					sendKey('keydown', keyCode);
				});
				function release(event) {
					event.preventDefault();
					button.classList.remove('pressed');
					sendKey('keyup', keyCode);
				}
				button.addEventListener('pointerup', release);
				button.addEventListener('pointercancel', release);
			});
		})();
	</script>
  </body>
</html>
