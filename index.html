<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Retro Tamagotchi Clone</title>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: #111;
				overflow: hidden;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100dvh;
				padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
				box-sizing: border-box;
			}

			canvas {
				display: block;
				width: min(calc(100vw - 16px), calc(100dvh - 16px)) !important;
				height: min(calc(100vw - 16px), calc(100dvh - 16px)) !important;
				aspect-ratio: 1 / 1;
				image-rendering: pixelated;
				touch-action: manipulation;
			}

			#mobile-controls {
				display: none;
				position: fixed;
				left: 0;
				right: 0;
				bottom: max(14px, env(safe-area-inset-bottom));
				z-index: 9999;
				justify-content: center;
				gap: 18px;
				pointer-events: none;
			}

			#mobile-controls button {
				width: 64px;
				height: 64px;
				border: 4px solid #171717;
				border-radius: 50%;
				background: rgba(238, 223, 169, 0.9);
				box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2), 0 3px 0 #000;
				color: #171717;
				font: bold 24px monospace;
				pointer-events: auto;
				touch-action: none;
				-webkit-user-select: none;
				user-select: none;
			}

			#mobile-controls button:active,
			#mobile-controls button.pressed {
				transform: translateY(3px);
				box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2), 0 0 0 #000;
			}

			#mobile-controls .hint {
				position: absolute;
				bottom: 70px;
				left: 0;
				right: 0;
				text-align: center;
				font: bold 11px monospace;
				color: rgba(255,255,255,0.72);
				text-shadow: 1px 1px #000;
			}

			@media (max-width: 820px), (pointer: coarse) {
				body {
					padding-bottom: 86px;
				}
				canvas {
					width: min(calc(100vw - 16px), calc(100dvh - 104px)) !important;
					height: min(calc(100vw - 16px), calc(100dvh - 104px)) !important;
				}
				#mobile-controls {
					display: flex;
				}
			}
		</style>
		<script src="js/phaser.js?v=20260826-2"></script>
		<script src="js/domain/p1-character-profiles.js?v=20260826-2"></script>
		<script src="js/domain/p1-device-engine.js?v=20260826-2"></script>
		<script src="js/ui/device-shell.js?v=20260826-2"></script>
		<script src="js/care/feeding-screen.js?v=20260826-2"></script>
		<script src="js/care/left-right-game.js?v=20260826-2"></script>
		<script src="js/shop.js?v=20260826-2"></script>
		<script src="js/system/save-storage.js?v=20260826-2"></script>
		<script src="js/settings.js?v=20260826-2"></script>
		<script src="js/game.js?v=20260826-2"></script>
  </head>
  <body>
	<div id="mobile-controls" aria-label="Tamagotchi controls">
		<div class="hint">A SELECT / LEFT · B OK / RIGHT · C BACK</div>
		<button type="button" data-key="65" aria-label="A button">A</button>
		<button type="button" data-key="66" aria-label="B button">B</button>
		<button type="button" data-key="67" aria-label="C button">C</button>
	</div>
	<script>
		(function () {
			function sendKey(type, keyCode) {
				var event = new KeyboardEvent(type, { bubbles: true, cancelable: true });
				try { Object.defineProperty(event, 'keyCode', { get: function(){ return keyCode; } }); } catch (_) {}
				try { Object.defineProperty(event, 'which', { get: function(){ return keyCode; } }); } catch (_) {}
				window.dispatchEvent(event);
			}

			document.querySelectorAll('#mobile-controls button').forEach(function (button) {
				var keyCode = Number(button.getAttribute('data-key'));
				button.addEventListener('pointerdown', function (event) {
					event.preventDefault();
					button.setPointerCapture(event.pointerId);
					button.classList.add('pressed');
					sendKey('keydown', keyCode);
				});
				function release(event) {
					event.preventDefault();
					button.classList.remove('pressed');
					sendKey('keyup', keyCode);
				}
				button.addEventListener('pointerup', release);
				button.addEventListener('pointercancel', release);
			});
		})();
	</script>
  </body>
</html>
