<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Retro Tamagotchi Clone</title>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: #050505;
				overflow: hidden;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100dvh;
				padding: 0;
				box-sizing: border-box;
			}

			#tamagotchi-console {
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;
				width: min(100vw, 52dvh);
				height: min(100dvh, 192.307vw);
				padding: 7% 6% 5%;
				box-sizing: border-box;
				border: 4px solid #18140d;
				border-radius: 48% 48% 43% 43% / 30% 30% 18% 18%;
				background: #d9c16f;
				box-shadow: inset 0 0 0 5px #f3df91, inset 0 -18px 0 rgba(79,54,12,.18), 0 0 0 2px #000;
				overflow: hidden;
			}

			#tamagotchi-console::before {
				content: "TAMAGOTCHI";
				font: bold clamp(11px, 2dvh, 18px) monospace;
				letter-spacing: .12em;
				color: #4e421c;
				margin: 0 0 2.5%;
			}

			#screen-bezel {
				width: 88%;
				aspect-ratio: 1 / 1;
				padding: 3.5%;
				box-sizing: border-box;
				border: 4px solid #3b321c;
				border-radius: 42% 42% 35% 35% / 23% 23% 18% 18%;
				background: #746c45;
				box-shadow: inset 0 0 0 3px #a79a60;
				flex: 0 0 auto;
			}

			#tamagotchi-screen {
				width: 100%;
				height: 100%;
				border: 3px solid #222;
				background: #78856a;
				box-sizing: border-box;
				overflow: hidden;
			}

			#tamagotchi-screen canvas {
				display: block;
				width: 100% !important;
				height: 100% !important;
				image-rendering: pixelated;
				touch-action: manipulation;
			}

			#mobile-controls {
				display: flex;
				position: relative;
				width: 86%;
				margin-top: auto;
				margin-bottom: 3%;
				z-index: 9999;
				justify-content: space-around;
				align-items: flex-end;
				gap: 5%;
			}

			#mobile-controls button {
				width: clamp(48px, 9dvh, 70px);
				height: clamp(48px, 9dvh, 70px);
				border: 4px solid #171717;
				border-radius: 50%;
				background: #a86445;
				box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2), 0 3px 0 #000;
				color: #2b150d;
				font: bold clamp(19px, 3dvh, 26px) monospace;
				pointer-events: auto;
				touch-action: none;
				-webkit-user-select: none;
				user-select: none;
			}

			#mobile-controls button:active,
			#mobile-controls button.pressed {
				transform: translateY(3px);
				box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2), 0 0 0 #000;
			}

			#mobile-controls .hint {
				position: absolute;
				bottom: calc(100% + 6px);
				left: 0;
				right: 0;
				text-align: center;
				font: bold clamp(8px, 1.35dvh, 11px) monospace;
				color: #51421a;
				text-shadow: none;
			}
		</style>
		<script src="js/phaser.js?v=20260826-2"></script>
		<script src="js/domain/p1-character-profiles.js?v=20260826-2"></script>
		<script src="js/domain/p1-device-engine.js?v=20260826-2"></script>
		<script src="js/ui/device-shell.js?v=20260826-2"></script>
		<script src="js/care/feeding-screen.js?v=20260826-2"></script>
		<script src="js/care/left-right-game.js?v=20260826-2"></script>
		<script src="js/shop.js?v=20260826-2"></script>
		<script src="js/system/save-storage.js?v=20260826-2"></script>
		<script src="js/settings.js?v=20260826-2"></script>
		<script src="js/game.js?v=20260826-3"></script>
  </head>
  <body>
	<div id="tamagotchi-console">
		<div id="screen-bezel"><div id="tamagotchi-screen"></div></div>
		<div id="mobile-controls" aria-label="Tamagotchi controls">
			<div class="hint">A SELECT / LEFT · B OK / RIGHT · C BACK</div>
			<button type="button" data-key="65" aria-label="A button">A</button>
			<button type="button" data-key="66" aria-label="B button">B</button>
			<button type="button" data-key="67" aria-label="C button">C</button>
		</div>
	</div>
	<script>
		(function () {
			function sendKey(type, keyCode) {
				var event = new KeyboardEvent(type, { bubbles: true, cancelable: true });
				try { Object.defineProperty(event, 'keyCode', { get: function(){ return keyCode; } }); } catch (_) {}
				try { Object.defineProperty(event, 'which', { get: function(){ return keyCode; } }); } catch (_) {}
				window.dispatchEvent(event);
			}

			document.querySelectorAll('#mobile-controls button').forEach(function (button) {
				var keyCode = Number(button.getAttribute('data-key'));
				button.addEventListener('pointerdown', function (event) {
					event.preventDefault();
					button.setPointerCapture(event.pointerId);
					button.classList.add('pressed');
					sendKey('keydown', keyCode);
				});
				function release(event) {
					event.preventDefault();
					button.classList.remove('pressed');
					sendKey('keyup', keyCode);
				}
				button.addEventListener('pointerup', release);
				button.addEventListener('pointercancel', release);
			});
		})();
	</script>
  </body>
</html>
